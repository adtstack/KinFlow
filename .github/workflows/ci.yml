name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FLUTTER_VERSION: 3.44.7
  JAVA_VERSION: "21"
  NODE_VERSION: 24.15.0

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run repository quality gate
        env:
          KINFLOW_CI_REPORT_DIR: ${{ github.workspace }}/ci-reports/quality
        run: scripts/ci/flutter-quality.sh
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.sha }}
          path: ci-reports/quality/
          if-no-files-found: warn
          retention-days: 14

  dependency_audit:
    name: Dependency vulnerability and license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve exact lockfiles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd apps/kinflow_app
          flutter pub get --enforce-lockfile
      - name: Audit dependency licenses
        run: >-
          node scripts/ci/dependency-audit.mjs
          --report ci-reports/dependency/dependency-audit.json
      - name: Scan known vulnerabilities without metadata egress
        env:
          KINFLOW_CI_REPORT_DIR: ${{ github.workspace }}/ci-reports/dependency
        run: scripts/ci/osv-offline-scan.sh
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report-${{ github.sha }}
          path: ci-reports/dependency/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Supabase DB, RLS, and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run local backend gate
        env:
          KINFLOW_CI_REPORT_DIR: ${{ github.workspace }}/ci-reports/backend
        run: scripts/ci/supabase-backend.sh
      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-report-${{ github.sha }}
          path: ci-reports/backend/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android ${{ matrix.flavor }} debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and audit APK
        env:
          KINFLOW_CI_REPORT_DIR: ${{ github.workspace }}/ci-reports/android/${{ matrix.flavor }}
        run: scripts/ci/android-build.sh ${{ matrix.flavor }}
      - name: Upload Android report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-report-${{ matrix.flavor }}-${{ github.sha }}
          path: ci-reports/android/${{ matrix.flavor }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kinflow-${{ matrix.flavor }}-debug-${{ github.sha }}
          path: apps/kinflow_app/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  gate:
    name: CI gate
    if: always()
    needs: [quality, dependency_audit, backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every foundation job
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency_audit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          {
            printf '%s\n' '## KinFlow CI gate'
            printf '%s\n' "- quality: $QUALITY_RESULT"
            printf '%s\n' "- dependency audit: $DEPENDENCY_RESULT"
            printf '%s\n' "- backend: $BACKEND_RESULT"
            printf '%s\n' "- Android matrix: $ANDROID_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$ANDROID_RESULT" = success
